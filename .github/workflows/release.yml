name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.3.0 (empty = project VERSION in CMakeLists.txt)"
        required: false
        default: ""
      prerelease:
        description: "Mark as pre-release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install mingw-w64
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mingw-w64 zip

      - name: Resolve version
        id: ver
        run: |
          v="${{ inputs.version }}"
          if [ -z "$v" ]; then
            v="$(sed -nE 's/^project\([^)]*VERSION ([0-9][0-9.]*).*/\1/p' CMakeLists.txt)"
          fi
          if ! echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$v' is not a version like 1.2.3"; exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$v" >/dev/null; then
            echo "::error::tag v$v already exists"; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build and test
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: bash build.sh

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          flags=(--title "FH2 Head Tracking $VERSION" --target "$GITHUB_SHA" --generate-notes)
          [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
          gh release create "v$VERSION" "dist/FH2HeadTracking-$VERSION.zip" "${flags[@]}"
